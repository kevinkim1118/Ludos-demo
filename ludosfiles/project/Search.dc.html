<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="_ds/ludos-design-system-17bf5b75-f1b6-40a2-8edc-89dd1714d926/tokens/fonts.css">
<link rel="stylesheet" href="_ds/ludos-design-system-17bf5b75-f1b6-40a2-8edc-89dd1714d926/tokens/colors.css">
<link rel="stylesheet" href="_ds/ludos-design-system-17bf5b75-f1b6-40a2-8edc-89dd1714d926/tokens/typography.css">
<link rel="stylesheet" href="_ds/ludos-design-system-17bf5b75-f1b6-40a2-8edc-89dd1714d926/tokens/spacing.css">
<link rel="stylesheet" href="_ds/ludos-design-system-17bf5b75-f1b6-40a2-8edc-89dd1714d926/tokens/base.css">
<link rel="stylesheet" href="_ds/ludos-design-system-17bf5b75-f1b6-40a2-8edc-89dd1714d926/components/core/button.css">
<link rel="stylesheet" href="_ds/ludos-design-system-17bf5b75-f1b6-40a2-8edc-89dd1714d926/styles.css">
<script src="_ds/ludos-design-system-17bf5b75-f1b6-40a2-8edc-89dd1714d926/_ds_bundle.js"></script>
<script src="./image-manifest.js"></script>
<script src="./image-slot.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #120D0E; }
  a { color: var(--text-accent); text-decoration: none; }
  a:hover { color: var(--accent-400); }
  [data-screen]::-webkit-scrollbar { width: 0; display: none; }
  input::placeholder { color: #8A787C; }
  @keyframes popIn { 0% { transform: scale(.5); } 60% { transform: scale(1.16); } 100% { transform: scale(1); } }
  @keyframes toastUp { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes sheetDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
  @keyframes resultIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</helmet>

<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(120% 80% at 50% 0%, #1A1314 0%, #110C0D 70%); font-family: 'Familjen Grotesk', ui-sans-serif, system-ui, sans-serif;">

  <div style="width: 430px; padding: 11px; background: #080606; border-radius: 46px; box-shadow: 0 30px 70px rgba(0,0,0,0.55), inset 0 0 0 1.5px #2A2023;">
    <div data-screen-label="Search" style="position: relative; width: 100%; height: 868px; background: var(--surface-0); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; color: var(--text-primary)">

      <!-- status bar -->
      <div style="flex: none; height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 28px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em;">
        <span>9:41</span>
        <span style="display: flex; align-items: center; gap: 7px;">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="var(--text-primary)"><rect x="0" y="7" width="3" height="4" rx="1"></rect><rect x="4.5" y="5" width="3" height="6" rx="1"></rect><rect x="9" y="2.5" width="3" height="8.5" rx="1"></rect><rect x="13.5" y="0" width="3" height="11" rx="1"></rect></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.6" y="0.6" width="20" height="10.8" rx="3" stroke="var(--text-primary)" stroke-opacity="0.5"></rect><rect x="2.2" y="2.2" width="14.5" height="7.6" rx="1.6" fill="var(--text-primary)"></rect><rect x="21.6" y="4" width="2" height="4" rx="1" fill="var(--text-primary)" fill-opacity="0.5"></rect></svg>
        </span>
      </div>

      <!-- search bar -->
      <div style="flex: none; padding: 6px 18px 14px;">
        <div style="display: flex; align-items: center; gap: 12px; border-bottom: 1.5px solid {{ searchUnderline }}; padding: 8px 2px; transition: border-color 160ms;">
          <input value="{{ query }}" onInput="{{ onInput }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" placeholder="Search for a game" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text-primary); font-family: inherit; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; padding: 0;">
          <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ onClear }}" style="width: 24px; height: 24px; flex: none; border: none; background: var(--surface-2); border-radius: 50%; color: var(--text-secondary); font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;" style-hover="background: var(--surface-3); color: var(--text-primary);">✕</button>
          </sc-if>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.8" style="flex: none;"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="15.5" y1="15.5" x2="21" y2="21" stroke-linecap="round"></line></svg>
        </div>
      </div>

      <!-- scrollable content -->
      <div data-screen="" style="flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 18px;">

        <!-- EMPTY STATE: curated sections -->
        <sc-if value="{{ showBrowse }}" hint-placeholder-val="{{ true }}">
        <div>
          <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="3">
            <div style="margin-bottom: 26px;">
              <div style="font-size: 21px; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 12px;">{{ sec.title }}</div>
              <div style="display: flex; flex-direction: column;">
                <sc-for list="{{ sec.games }}" as="g" hint-placeholder-count="3">
                  <button onClick="{{ g.onPick }}" style="display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; padding: 9px 0; font-family: inherit; cursor: pointer; border-bottom: 1px solid #2C2124;" style-hover="opacity: 0.72;">
                    <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 400; color: var(--text-muted)">{{ g.name }}</span>
                    
                    
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-for>
          <div style="height: 12px;"></div>
        </div>
        </sc-if>

        <!-- RESULTS STATE -->
        <sc-if value="{{ showResults }}" hint-placeholder-val="{{ false }}">
        <div style="padding-top: 4px;">
          <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <sc-for list="{{ results }}" as="g" hint-placeholder-count="3">
              <div style="background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; animation: resultIn 220ms cubic-bezier(0.2,0,0,1); transition: transform 160ms cubic-bezier(0.2,0,0,1), border-color 160ms;" style-hover="transform: translateY(-3px); border-color: var(--border-strong);">
                <div style="position: relative;">
                  <image-slot id="{{ g.slotId }}" shape="rect" placeholder="cover" style="display: block; width: 100%; aspect-ratio: 600 / 900; background: var(--border);"></image-slot>
                  <button onClick="{{ g.onAdd }}" style="position: absolute; top: 6px; right: 6px; padding: 0; border: none; background: none; cursor: pointer;">
                    <sc-if value="{{ g.notAdded }}" hint-placeholder-val="{{ true }}">
                      <span style="display: flex; width: 26px; height: 26px; border-radius: 8px; background: rgba(18,11,13,0.62); border: 1px solid rgba(240,233,233,0.16); color: var(--text-primary); align-items: center; justify-content: center; font-size: 16px; line-height: 1; backdrop-filter: blur(4px);" style-hover="background: var(--accent-500); border-color: var(--accent-500); color: var(--on-accent);">+</span>
                    </sc-if>
                    <sc-if value="{{ g.added }}" hint-placeholder-val="{{ false }}">
                      <span style="display: flex; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-500); color: var(--on-accent); align-items: center; justify-content: center; font-size: 14px; font-weight: 600; animation: popIn 240ms cubic-bezier(0.2,0,0,1);">✓</span>
                    </sc-if>
                  </button>
                </div>
                <div style="padding: 8px 9px 10px;">
                  <div style="font-size: 12px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.18;">{{ g.name }}</div>
                  <div style="font-size: 9.5px; color: var(--text-muted); margin-top: 3px;">{{ g.platform }}</div>
                </div>
              </div>
            </sc-for>
          </div>
          </sc-if>

          <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 70px 24px 40px;">
            <div style="width: 54px; height: 54px; border-radius: 15px; background: var(--surface-1); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: #8A787C; margin-bottom: 16px;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="15.5" y1="15.5" x2="21" y2="21" stroke-linecap="round"></line></svg>
            </div>
            <div style="font-size: 17px; font-weight: 600;">No games found</div>
            <div style="font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-top: 6px; max-width: 240px;">Nothing matches “<span>{{ query }}</span>”. Try a different title or spelling.</div>
          </div>
          </sc-if>
        </div>
        </sc-if>

        <div style="height: 14px;"></div>
      </div>

      <!-- status sheet (overlay) -->
      <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; z-index: 30;">
        <div onClick="{{ onCloseSheet }}" style="position: absolute; inset: 0; background: rgba(8,5,6,0.62); animation: {{ sheetScrimAnim }};"></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; background: var(--surface-1); border-top: 1px solid var(--border-strong); border-radius: 22px 22px 0 0; padding: 10px 18px 24px; box-shadow: 0 -14px 44px rgba(0,0,0,0.55); animation: {{ sheetPanelAnim }};">
          <div style="width: 40px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 0 auto 16px;"></div>
          <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Add <span>{{ sheetName }}</span> to…</div>
          <div style="font-size: 12.5px; color: var(--text-muted); margin: 3px 0 16px;">Set a status to start tracking it</div>

          <button onClick="{{ onPickWant }}" style="display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--accent-500); color: var(--on-accent); border: none; border-radius: 11px; padding: 14px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; margin-bottom: 9px; transition: background 120ms cubic-bezier(0.2,0,0,1);" style-hover="background: var(--accent-400);" style-active="background: var(--accent-600);">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" style="flex: none;"><path d="M5 3h10v14l-5-3.4L5 17V3z"></path></svg>
            Add to backlog
          </button>
          <button onClick="{{ onPickPlaying }}" style="display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 11px; padding: 14px; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; margin-bottom: 9px;" style-hover="background: var(--surface-2);">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" style="flex: none;"><path d="M6 4l11 6-11 6V4z"></path></svg>
            Mark as playing
          </button>
          <button onClick="{{ onPickFinished }}" style="display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 11px; padding: 14px; font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;" style-hover="background: var(--surface-2);">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 10.5l4 4 8-9"></path></svg>
            Mark as finished
          </button>
        </div>
      </div>
      </sc-if>

      <!-- toast -->
      <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text-primary); font-size: 12.5px; font-weight: 500; padding: 10px 16px; border-radius: 999px; box-shadow: 0 8px 28px rgba(0,0,0,0.5); white-space: nowrap; animation: toastUp 200ms cubic-bezier(0.2,0,0,1); z-index: 20;">{{ toast }}</div>
      </sc-if>

      <!-- bottom tab bar -->
      <div style="flex: none; height: 64px; display: flex; align-items: center; padding: 0 4px 6px; border-top: 1px solid var(--surface-1); background: var(--surface-0);">
        <button onClick="{{ onGoDiscover }}" style="flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: inherit; color: var(--text-muted);" style-hover="color: var(--text-secondary);">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"></circle><circle cx="11" cy="11" r="1.7" fill="currentColor" stroke="none"></circle></svg>
          <span style="font-size: 10px; font-weight: 500;">Discover</span>
        </button>
        <button onClick="{{ onGoLibrary }}" style="flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: inherit; color: var(--text-muted);" style-hover="color: var(--text-secondary);">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><rect x="4" y="5" width="3.4" height="12" rx="1.2"></rect><rect x="9.3" y="5" width="3.4" height="12" rx="1.2"></rect><rect x="14.6" y="5" width="3.4" height="12" rx="1.2"></rect></svg>
          <span style="font-size: 10px; font-weight: 500;">Library</span>
        </button>
        <button style="flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: inherit; color: var(--text-muted);" style-hover="color: var(--text-secondary);">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="9" r="3.4"></circle><circle cx="14.5" cy="9.5" r="2.8"></circle><path d="M3.5 17c0-2.5 2-4 5-4s5 1.5 5 4"></path></svg>
          <span style="font-size: 10px; font-weight: 500;">Friends</span>
        </button>
        <button style="flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: inherit; color: var(--accent-300);">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9.5" cy="9.5" r="6"></circle><line x1="14" y1="14" x2="19" y2="19" stroke-linecap="round"></line></svg>
          <span style="font-size: 10px; font-weight: 600;">Search</span>
        </button>
        <button onClick="{{ onTabProfile }}" style="flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: inherit; color: var(--text-muted);" style-hover="color: var(--text-secondary);">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="7.5" r="3.6"></circle><path d="M4 18.5c0-3.4 3.1-5.2 7-5.2s7 1.8 7 5.2"></path></svg>
          <span style="font-size: 10px; font-weight: 500;">Profile</span>
        </button>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:472,&quot;height&quot;:908}}">
class Component extends DCLogic {
  state = { query: '', focused: false, want: {}, sheet: null, sheetClosing: false, toast: null };

  db() {
    return [
      { k: 'meccha', n: 'Meccha Chameleon', p: 'PC · PS5 · Xbox' },
      { k: 'gamble', n: 'Gamble With Your Friends', p: 'PC' },
      { k: 'elden', n: 'Elden Ring', p: 'PC · PS5 · Xbox' },
      { k: 'sekiro', n: 'Sekiro', p: 'PC · PS5' },
      { k: 'zelda', n: 'Legend of Zelda: Tears of the Kingdom', p: 'Switch' },
      { k: 'acbf', n: "Assassin's Creed Black Flag: Resynched", p: 'PC · PS5 · Xbox' },
      { k: 'mina', n: 'Mina the Hollower', p: 'PC · Switch · PS5' },
      { k: 'hades2', n: 'Hades II', p: 'PC · Switch' },
      { k: 'hollow', n: 'Hollow Knight', p: 'PC · Switch' },
      { k: 'outerwilds', n: 'Outer Wilds', p: 'PC · Xbox' },
      { k: 'celeste', n: 'Celeste', p: 'PC · Switch' },
      { k: 'tunic', n: 'Tunic', p: 'PC · PS5' },
      { k: 'disco', n: 'Disco Elysium', p: 'PC · PS5' },
      { k: 'bg3', n: "Baldur's Gate 3", p: 'PC · PS5' },
      { k: 'firstlight', n: '007 First Light', p: 'PC · PS5' },
      { k: 'subnautica', n: 'Subnautica 2', p: 'PC · Xbox' },
      { k: 'forza', n: 'Forza Horizon 6', p: 'PC · Xbox' },
      { k: 'pragmata', n: 'PRAGMATA', p: 'PC · PS5' },
      { k: 'stray', n: 'Stray', p: 'PC · PS5' },
      { k: 'citizen', n: 'Citizen Sleeper', p: 'PC · Switch' },
    ];
  }

  openSheet(id, name) {
    if (this._s) clearTimeout(this._s);
    this.setState({ sheet: { id, name }, sheetClosing: false });
  }

  closeSheet() {
    if (!this.state.sheet) return;
    if (this._s) clearTimeout(this._s);
    this.setState({ sheetClosing: true });
    this._s = setTimeout(() => this.setState({ sheet: null, sheetClosing: false }), 280);
  }

  setStatus(kind) {
    const sheet = this.state.sheet;
    if (!sheet) return;
    const id = sheet.id;
    if (this._s) clearTimeout(this._s);
    this.setState(s => ({
      want: { ...s.want, [id]: true },
      sheetClosing: true,
    }));
    this._s = setTimeout(() => this.setState({ sheet: null, sheetClosing: false }), 280);
    const msg = kind === 'want' ? 'Added to your backlog'
      : kind === 'playing' ? 'Marked as playing'
      : 'Marked as finished';
    this.flash(msg);
  }

  flash(msg) {
    if (this._t) clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(() => this.setState({ toast: null }), 1900);
  }

  renderVals() {
    const query = this.state.query;
    const q = query.trim().toLowerCase();
    const hasQuery = q.length > 0;
    const want = this.state.want;

    const mapGame = (g) => {
      const id = g.k;
      return {
        slotId: 'cv-search-' + id, name: g.n, platform: g.p,
        added: !!want[id], notAdded: !want[id],
        onAdd: () => this.openSheet(id, g.n),
        onPick: () => this.setState({ query: g.n }),
      };
    };

    const results = hasQuery
      ? this.db().filter(g => g.n.toLowerCase().includes(q)).map(mapGame)
      : [];

    const byKey = {};
    this.db().forEach(g => { byKey[g.k] = g; });
    const sec = (title, keys) => ({ title, games: keys.map(k => mapGame(byKey[k])) });

    return {
      query,
      hasQuery,
      searchUnderline: this.state.focused ? 'var(--accent-500)' : 'var(--border)',
      onInput: (e) => this.setState({ query: e.target.value }),
      onFocus: () => this.setState({ focused: true }),
      onBlur: () => this.setState({ focused: false }),
      onClear: () => this.setState({ query: '' }),

      showBrowse: !hasQuery,
      showResults: hasQuery,
      hasResults: hasQuery && results.length > 0,
      noResults: hasQuery && results.length === 0,
      results,

      sections: [
        sec('Trending Right Now', ['meccha', 'gamble']),
        sec('Popular with Completionists', ['elden', 'sekiro', 'zelda']),
        sec('New Releases', ['acbf', 'mina']),
      ],

      sheetOpen: !!this.state.sheet,
      sheetName: this.state.sheet ? this.state.sheet.name : '',
      sheetScrimAnim: this.state.sheetClosing ? 'fadeOut 180ms ease forwards' : 'fadeIn 180ms ease',
      sheetPanelAnim: this.state.sheetClosing ? 'sheetDown 280ms cubic-bezier(0.2,0,0,1) forwards' : 'sheetUp 280ms cubic-bezier(0.2,0,0,1)',
      onCloseSheet: () => this.closeSheet(),
      onPickWant: () => this.setStatus('want'),
      onPickPlaying: () => this.setStatus('playing'),
      onPickFinished: () => this.setStatus('finished'),

      hasToast: !!this.state.toast,
      toast: this.state.toast,

      onGoDiscover: () => { window.location.href = 'Discover Home.dc.html'; },
      onGoLibrary: () => { window.location.href = 'Library.dc.html'; },
      onTabProfile: () => { window.location.href = 'Profile.dc.html'; },
    };
  }
}
</script>
</body>
</html>
