<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#241B1D" />
    <meta
      name="description"
      content="Ludos — uncover hidden gems, figure out what to play next, conquer your backlog."
    />
    <title>Ludos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts are self-hosted (see scripts/fetch-fonts.mjs). Preload the Latin
         cuts so headings paint in the right face on first frame. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/familjen-grotesk-normal-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/newsreader-normal-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
